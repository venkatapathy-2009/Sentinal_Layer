<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InjScan — Telemetry & Security Operations Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            navy: {
              950: '#070d18',
              900: '#0c172a',
              850: '#111f38',
              800: '#172744',
              700: '#23385d',
            },
            verdict: {
              blocked: '#ef4444',
              leaked: '#f59e0b',
              passed: '#10b981',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #070d18;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .animate-pulse-glow {
      animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0c172a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DJANGO_API = 'http://localhost:8001/v1/events';
    const FASTAPI_SHIELD_BASE = 'http://127.0.0.1:9000/shield';
    const API_KEY = 'ts-dev-key-123';
    const POLL_INTERVAL_MS = 2500;

    // Verdict Badge Component
    function VerdictBadge({ verdict }) {
      const v = (verdict || '').toLowerCase();
      if (v === 'blocked') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-950/80 text-red-400 border border-red-700/60 shadow-sm shadow-red-950">
            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.002A11.959 11.959 0 0112 2.714zm0 13.036h.01" />
            </svg>
            BLOCKED
          </span>
        );
      }
      if (v === 'leaked') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-950/80 text-amber-400 border border-amber-600/60 shadow-sm shadow-amber-950">
            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            LEAKED
          </span>
        );
      }
      return (
        <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-600/60 shadow-sm shadow-emerald-950">
          <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          PASSED
        </span>
      );
    }

    // Severity Badge Component
    function SeverityBadge({ severity }) {
      const s = (severity || '').toLowerCase();
      if (s === 'critical') {
        return (
          <span className="px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider bg-red-900/60 text-red-300 border border-red-500/40">
            CRITICAL
          </span>
        );
      }
      if (s === 'high') {
        return (
          <span className="px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider bg-amber-900/60 text-amber-300 border border-amber-500/40">
            HIGH
          </span>
        );
      }
      return (
        <span className="px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider bg-slate-800 text-slate-300 border border-slate-700">
          LOW
        </span>
      );
    }

    // Shield Badge Component
    function ShieldBadge({ shield }) {
      const is = (shield || '').toUpperCase() === 'ON';
      return is ? (
        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-emerald-900/40 text-emerald-400 border border-emerald-800">
          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          ON
        </span>
      ) : (
        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-slate-800/80 text-slate-400 border border-slate-700">
          <span className="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
          OFF
        </span>
      );
    }

    function App() {
      const [events, setEvents] = useState([]);
      const [isConnected, setIsConnected] = useState(false);
      const [lastError, setLastError] = useState(null);
      const [shieldState, setShieldState] = useState(true); // default ON
      const [shieldLoading, setShieldLoading] = useState(false);
      const [shieldNotice, setShieldNotice] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [filterVerdict, setFilterVerdict] = useState('ALL');
      const [expandedRow, setExpandedRow] = useState(null);
      const [isAutoPolling, setIsAutoPolling] = useState(true);

      // Fetch events from Django backend
      const fetchEvents = async () => {
        try {
          const res = await fetch(DJANGO_API, {
            headers: {
              'X-API-Key': API_KEY,
            },
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          const data = await res.json();
          setEvents(Array.isArray(data) ? data : []);
          setIsConnected(true);
          setLastError(null);
        } catch (err) {
          setIsConnected(false);
          setLastError(err.message || 'Cannot reach Django backend on port 8000');
        }
      };

      // Toggle Shield via FastAPI bank bot at http://127.0.0.1:9000/shield/on or /shield/off
      const toggleShield = async () => {
        const nextState = !shieldState;
        const targetEndpoint = nextState ? `${FASTAPI_SHIELD_BASE}/on` : `${FASTAPI_SHIELD_BASE}/off`;
        setShieldLoading(true);

        try {
          const res = await fetch(targetEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });
          if (res.ok) {
            const data = await res.json();
            setShieldState(data.shield ?? nextState);
            setShieldNotice(`FastAPI Bank Bot shield switched to ${nextState ? 'ON' : 'OFF'}`);
          } else {
            // Still toggle UI state, but notify
            setShieldState(nextState);
            setShieldNotice(`Bank Bot at 127.0.0.1:9000 returned status ${res.status}`);
          }
        } catch (err) {
          // If 9000 is offline, still update state and alert
          setShieldState(nextState);
          setShieldNotice(`Shield switched ${nextState ? 'ON' : 'OFF'} (Warning: Bank Bot at http://127.0.0.1:9000 unreachable)`);
        } finally {
          setShieldLoading(false);
          setTimeout(() => setShieldNotice(null), 4000);
        }
      };

      // Periodic polling
      useEffect(() => {
        fetchEvents();
        if (!isAutoPolling) return;
        const timer = setInterval(fetchEvents, POLL_INTERVAL_MS);
        return () => clearInterval(timer);
      }, [isAutoPolling]);

      // Filtered events
      const filteredEvents = events.filter((ev) => {
        if (filterVerdict !== 'ALL' && (ev.verdict || '').toLowerCase() !== filterVerdict.toLowerCase()) {
          return false;
        }
        if (!searchTerm) return true;
        const q = searchTerm.toLowerCase();
        return (
          (ev.app_id || '').toLowerCase().includes(q) ||
          (ev.attack || '').toLowerCase().includes(q) ||
          (ev.evidence || '').toLowerCase().includes(q) ||
          (ev.verdict || '').toLowerCase().includes(q) ||
          (ev.severity || '').toLowerCase().includes(q)
        );
      });

      // Quick counts
      const totalCount = events.length;
      const blockedCount = events.filter(e => (e.verdict || '').toLowerCase() === 'blocked').length;
      const leakedCount = events.filter(e => (e.verdict || '').toLowerCase() === 'leaked').length;
      const passedCount = events.filter(e => (e.verdict || '').toLowerCase() === 'passed').length;

      return (
        <div className="flex-1 flex flex-col">
          {/* Top Navbar */}
          <header className="sticky top-0 z-50 bg-navy-900/95 backdrop-blur border-b border-navy-700/80 px-6 py-3.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Logo & Title */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow-md shadow-red-950">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.002A11.959 11.959 0 0112 2.714z" />
                  </svg>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base font-bold text-white tracking-wide">INJSCAN</h1>
                    <span className="text-[10px] px-1.5 py-0.5 rounded font-mono bg-navy-800 text-slate-400 border border-navy-700">SOC TELEMETRY</span>
                  </div>
                  <p className="text-xs text-slate-400">LLM Prompt Injection Defence & Monitoring</p>
                </div>
              </div>

              {/* Status & Controls */}
              <div className="flex items-center gap-6">

                {/* Live Connection Dot */}
                <div className="flex items-center gap-2.5 px-3 py-1.5 rounded-full bg-navy-950 border border-navy-700/80 text-xs font-medium">
                  {isConnected ? (
                    <>
                      <span className="relative flex h-2.5 w-2.5">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                      </span>
                      <span className="text-emerald-400 font-semibold">LIVE CONNECTED</span>
                      <span className="text-slate-500 font-mono text-[10px]">:8000</span>
                    </>
                  ) : (
                    <>
                      <span className="relative flex h-2.5 w-2.5">
                        <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 animate-pulse"></span>
                      </span>
                      <span className="text-red-400 font-semibold">DISCONNECTED</span>
                      <span className="text-slate-500 font-mono text-[10px]">:8000</span>
                    </>
                  )}
                </div>

                {/* Shield ON/OFF Toggle */}
                <div className="flex items-center gap-3 pl-2 border-l border-navy-700">
                  <div className="text-right">
                    <div className="text-xs font-semibold text-slate-200">
                      SHIELD GUARD
                    </div>
                    <div className="text-[11px] font-mono text-slate-400">
                      {shieldState ? (
                        <span className="text-emerald-400 font-bold">ACTIVE (ON)</span>
                      ) : (
                        <span className="text-red-400 font-bold">DISABLED (OFF)</span>
                      )}
                    </div>
                  </div>

                  <button
                    onClick={toggleShield}
                    disabled={shieldLoading}
                    title="Click to toggle Shield (calls POST http://127.0.0.1:9000/shield/on or /off)"
                    className={`relative inline-flex h-7 w-13 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-navy-900 ${
                      shieldState ? 'bg-emerald-600' : 'bg-slate-700'
                    }`}
                    style={{ width: '52px' }}
                  >
                    <span
                      className={`pointer-events-none inline-block h-6 w-6 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                        shieldState ? 'translate-x-6' : 'translate-x-0'
                      }`}
                    />
                  </button>
                </div>

                {/* Manual Refresh Button */}
                <button
                  onClick={fetchEvents}
                  className="p-2 rounded-lg bg-navy-800 hover:bg-navy-700 text-slate-300 hover:text-white border border-navy-700 transition"
                  title="Refresh telemetry"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                  </svg>
                </button>

              </div>
            </div>
          </header>

          {/* Toast Notification Banner */}
          {shieldNotice && (
            <div className="bg-navy-800 border-b border-navy-700 px-6 py-2 text-center text-xs font-mono text-cyan-300 transition-all">
              ⚡ {shieldNotice}
            </div>
          )}

          {/* Connection Error Banner */}
          {!isConnected && (
            <div className="bg-red-950/70 border-b border-red-800/80 px-6 py-2 text-center text-xs text-red-300 flex items-center justify-center gap-2">
              <svg className="w-4 h-4 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span>Django API unreachable on <code>http://localhost:8000/v1/events</code> ({lastError}). Please ensure the Django dev server is running.</span>
            </div>
          )}

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col gap-6">

            {/* Metrics Overview Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-navy-900 border border-navy-800 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="text-xs font-medium text-slate-400">Total Telemetry Events</div>
                  <div className="text-2xl font-bold text-white mt-1">{totalCount}</div>
                </div>
                <div className="w-10 h-10 rounded-lg bg-navy-800 border border-navy-700 flex items-center justify-center text-slate-400">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5" />
                  </svg>
                </div>
              </div>

              <div className="bg-navy-900 border border-red-900/40 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="text-xs font-medium text-red-400">Blocked Attacks</div>
                  <div className="text-2xl font-bold text-red-300 mt-1">{blockedCount}</div>
                </div>
                <div className="w-10 h-10 rounded-lg bg-red-950/60 border border-red-800/60 flex items-center justify-center text-red-400 font-bold">
                  🛡️
                </div>
              </div>

              <div className="bg-navy-900 border border-amber-900/40 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="text-xs font-medium text-amber-400">Leaked Breaches</div>
                  <div className="text-2xl font-bold text-amber-300 mt-1">{leakedCount}</div>
                </div>
                <div className="w-10 h-10 rounded-lg bg-amber-950/60 border border-amber-800/60 flex items-center justify-center text-amber-400 font-bold">
                  ⚠️
                </div>
              </div>

              <div className="bg-navy-900 border border-emerald-900/40 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="text-xs font-medium text-emerald-400">Passed Inquiries</div>
                  <div className="text-2xl font-bold text-emerald-300 mt-1">{passedCount}</div>
                </div>
                <div className="w-10 h-10 rounded-lg bg-emerald-950/60 border border-emerald-800/60 flex items-center justify-center text-emerald-400 font-bold">
                  ✅
                </div>
              </div>
            </div>

            {/* Filter and Search Bar */}
            <div className="bg-navy-900 border border-navy-800 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="relative w-full md:w-96">
                <input
                  type="text"
                  placeholder="Search attack, app ID, evidence..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-navy-950 border border-navy-700 rounded-lg pl-9 pr-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-red-500"
                />
                <svg className="w-4 h-4 text-slate-500 absolute left-3 top-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" />
                </svg>
              </div>

              <div className="flex items-center gap-2 w-full md:w-auto">
                <span className="text-xs text-slate-400 font-medium">Verdict:</span>
                {['ALL', 'BLOCKED', 'LEAKED', 'PASSED'].map((filter) => (
                  <button
                    key={filter}
                    onClick={() => setFilterVerdict(filter)}
                    className={`px-3 py-1 rounded-lg text-xs font-medium transition ${
                      filterVerdict === filter
                        ? 'bg-red-600 text-white shadow'
                        : 'bg-navy-800 text-slate-400 hover:text-white'
                    }`}
                  >
                    {filter}
                  </button>
                ))}
              </div>
            </div>

            {/* Telemetry Table Container */}
            <div className="bg-navy-900 border border-navy-800 rounded-xl overflow-hidden shadow-xl flex-1 flex flex-col">
              <div className="px-6 py-4 border-b border-navy-800 flex items-center justify-between bg-navy-850">
                <div className="flex items-center gap-2.5">
                  <div className="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                  <h2 className="text-sm font-bold text-white uppercase tracking-wider">Telemetry Events Stream</h2>
                  <span className="text-xs font-mono text-slate-400">({filteredEvents.length} items)</span>
                </div>
                <div className="flex items-center gap-3">
                  <label className="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={isAutoPolling}
                      onChange={(e) => setIsAutoPolling(e.target.checked)}
                      className="rounded border-navy-700 bg-navy-950 text-red-500 focus:ring-0"
                    />
                    Auto-poll (2.5s)
                  </label>
                </div>
              </div>

              {/* Table */}
              <div className="overflow-x-auto flex-1">
                <table className="w-full text-left text-xs">
                  <thead className="bg-navy-950/80 text-slate-400 uppercase text-[11px] font-semibold tracking-wider border-b border-navy-800">
                    <tr>
                      <th className="py-3.5 px-4 w-28">Verdict</th>
                      <th className="py-3.5 px-4 w-24">Severity</th>
                      <th className="py-3.5 px-4 w-36">App ID</th>
                      <th className="py-3.5 px-4">Attack Prompt</th>
                      <th className="py-3.5 px-4">Evidence</th>
                      <th className="py-3.5 px-4 w-20 text-center">Shield</th>
                      <th className="py-3.5 px-4 w-36 text-right">Time</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-navy-800/60 font-mono">
                    {filteredEvents.length === 0 ? (
                      <tr>
                        <td colSpan="7" className="py-16 text-center text-slate-500 font-sans">
                          <div className="max-w-md mx-auto flex flex-col items-center">
                            <div className="w-12 h-12 rounded-full bg-navy-800 flex items-center justify-center text-slate-400 mb-3 text-xl">
                              🛡️
                            </div>
                            <p className="text-sm font-semibold text-slate-300">No telemetry events recorded yet</p>
                            <p className="text-xs text-slate-500 mt-1">
                              When <code className="text-slate-400">scanner.py</code> or <code className="text-slate-400">bank_bot.py</code> sends events via <code className="text-slate-400">POST /v1/events</code>, they will stream live here.
                            </p>
                          </div>
                        </td>
                      </tr>
                    ) : (
                      filteredEvents.map((ev, idx) => {
                        const isExpanded = expandedRow === ev.id || expandedRow === idx;
                        return (
                          <React.Fragment key={ev.id || idx}>
                            <tr
                              onClick={() => setExpandedRow(isExpanded ? null : (ev.id || idx))}
                              className={`cursor-pointer transition-colors hover:bg-navy-800/50 ${
                                isExpanded ? 'bg-navy-800/70' : (idx % 2 === 0 ? 'bg-navy-900' : 'bg-navy-950/30')
                              }`}
                            >
                              {/* Verdict Column */}
                              <td className="py-3 px-4 font-sans whitespace-nowrap">
                                <VerdictBadge verdict={ev.verdict} />
                              </td>

                              {/* Severity Column */}
                              <td className="py-3 px-4 font-sans whitespace-nowrap">
                                <SeverityBadge severity={ev.severity} />
                              </td>

                              {/* App ID Column */}
                              <td className="py-3 px-4 text-slate-300 whitespace-nowrap font-medium">
                                <span className="bg-navy-950 px-2 py-0.5 rounded border border-navy-800 text-[11px] text-cyan-300">
                                  {ev.app_id}
                                </span>
                              </td>

                              {/* Attack Column */}
                              <td className="py-3 px-4 text-slate-200 max-w-xs truncate" title={ev.attack}>
                                {ev.attack}
                              </td>

                              {/* Evidence Column */}
                              <td className="py-3 px-4 text-slate-400 max-w-xs truncate" title={ev.evidence}>
                                <span className={ev.verdict === 'leaked' ? 'text-amber-400 font-medium' : ''}>
                                  {ev.evidence || '—'}
                                </span>
                              </td>

                              {/* Shield Column */}
                              <td className="py-3 px-4 text-center whitespace-nowrap font-sans">
                                <ShieldBadge shield={ev.shield} />
                              </td>

                              {/* Time Column */}
                              <td className="py-3 px-4 text-right text-slate-400 whitespace-nowrap text-[11px]">
                                {ev.time || ev.created_at || 'Just now'}
                              </td>
                            </tr>

                            {/* Expanded Detail View */}
                            {isExpanded && (
                              <tr className="bg-navy-950/90 border-b border-navy-800">
                                <td colSpan="7" className="p-4 text-xs font-sans">
                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-navy-900 border border-navy-800 rounded-lg p-4">
                                    <div>
                                      <h4 className="text-[11px] uppercase tracking-wider font-bold text-slate-400 mb-1">Full Attack Prompt:</h4>
                                      <pre className="p-3 bg-navy-950 border border-navy-800 rounded text-xs text-rose-300 font-mono whitespace-pre-wrap break-all max-h-48 overflow-y-auto">
                                        {ev.attack}
                                      </pre>
                                    </div>
                                    <div>
                                      <h4 className="text-[11px] uppercase tracking-wider font-bold text-slate-400 mb-1">Detection Evidence & Diagnostics:</h4>
                                      <pre className="p-3 bg-navy-950 border border-navy-800 rounded text-xs text-amber-300 font-mono whitespace-pre-wrap break-all max-h-48 overflow-y-auto">
                                        {ev.evidence || 'No detailed evidence recorded.'}
                                      </pre>
                                      <div className="mt-2 text-[11px] text-slate-400">
                                        <strong>Event ID:</strong> {ev.id} &nbsp;|&nbsp; <strong>Target App:</strong> {ev.app_id} &nbsp;|&nbsp; <strong>Timestamp:</strong> {ev.created_at || ev.time}
                                      </div>
                                    </div>
                                  </div>
                                </td>
                              </tr>
                            )}
                          </React.Fragment>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>

          </main>

          {/* Footer */}
          <footer className="mt-auto border-t border-navy-800 bg-navy-950 px-6 py-3 text-xs text-slate-500 text-center flex items-center justify-between max-w-7xl mx-auto w-full">
            <div>InjScan Security Suite &copy; 2026. All rights reserved.</div>
            <div className="flex items-center gap-4 text-[11px] font-mono">
              <span>Django API: <span className="text-slate-300">http://localhost:8000/v1/events</span></span>
              <span>•</span>
              <span>FastAPI Bank Bot: <span className="text-slate-300">http://127.0.0.1:9000/shield/*</span></span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
